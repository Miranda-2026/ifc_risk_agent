command: ["uv", "run", "start-app"]
# databricks apps listen by default on port 8000

env:
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
  - name: MLFLOW_REGISTRY_URI
    value: "databricks-uc"
  - name: API_PROXY
    value: "http://localhost:8000/invocations"
  - name: CHAT_APP_PORT
    value: "3000"
  - name: CHAT_PROXY_TIMEOUT_SECONDS
    value: "300"
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: "experiment"
  # For manual Apps deployments, fill these in and add the Genie resource in
  # the app's resource settings. Bundle deployments use databricks.yml instead.
- name: IFC_GENIE_SPACE_ID
  valueFrom: genie-space
  - name: IFC_MODEL_ENDPOINT
    value: "databricks-gpt-oss-20b"
  - name: IFC_DASHBOARD_URL
    value: ""
